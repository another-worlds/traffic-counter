  # ---------------------------------------------------------------------------
  # timestamp_correction: OSD timestamp mapping + gap-corrected counts.
  # Reads analyzed videos from the counter API and writes timestamp_* artifacts
  # to shared storage. See timestamp_correction/.
  # ---------------------------------------------------------------------------
  timestamp-correction-api:
    build:
      context: ./timestamp_correction/backend
    runtime: nvidia
    command: ./start.sh
    environment:
      TRAFFIC_COUNTER_API_URL: http://api:8000
      DATABASE_URL: postgresql+psycopg://traffic:traffic@db:5432/traffic
      STORAGE_BACKEND: local
      LOCAL_STORAGE_ROOT: /data
      ENV: dev
      DEVICE: cuda:0
      NVIDIA_VISIBLE_DEVICES: all
      CORS_ORIGINS: "*"
      SAMPLE_INTERVAL_MINUTES: "1"
      USE_COHERENCE_MAP: "true"
      USE_SYNC_MAP: "false"
      SYNC_BIN_DURATION_S: "60"
      COHERENCE_TOLERANCE_S: "5"
      SYNC_TOLERANCE_S: "5"
      IDEAL_DAY_START: "00:00:00"
      IDEAL_DAY_END: "24:00:00"
      IDEAL_DAY_DATE_MODE: "first_osd"
      IDEAL_MAP_MODE: "realtime"
      SYNC_STABLE_BINS_REQUIRED: "2"
      TIMELINE_SAMPLE_MODE: "seek"
      PROGRESS_WRITE_INTERVAL_S: "3"
    ports: ["8200:8200"]
    volumes:
      - storage:/data
      - ./timestamp_correction/backend:/app
      - ${YADISK_HOST_PATH:-/mnt/yandex-videos}:${YADISK_HOST_PATH:-/mnt/yandex-videos}:ro
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  timestamp-correction-worker:
    build:
      context: ./timestamp_correction/backend
    runtime: nvidia
    command: ./start_worker.sh
    environment:
      TRAFFIC_COUNTER_API_URL: http://api:8000
      DATABASE_URL: postgresql+psycopg://traffic:traffic@db:5432/traffic
      STORAGE_BACKEND: local
      LOCAL_STORAGE_ROOT: /data
      WORKER_MODE: poll
      AUTO_SCAN_ENABLED: "false"
      DEVICE: cuda:0
      NVIDIA_VISIBLE_DEVICES: all
      POLL_INTERVAL_S: "30"
      STALE_PROCESSING_S: "7200"
      SAMPLE_INTERVAL_MINUTES: "1"
      USE_COHERENCE_MAP: "true"
      USE_SYNC_MAP: "false"
      SYNC_BIN_DURATION_S: "60"
      COHERENCE_TOLERANCE_S: "5"
      SYNC_TOLERANCE_S: "5"
      IDEAL_DAY_START: "00:00:00"
      IDEAL_DAY_END: "24:00:00"
      IDEAL_DAY_DATE_MODE: "first_osd"
      IDEAL_MAP_MODE: "realtime"
      SYNC_STABLE_BINS_REQUIRED: "2"
      TIMELINE_SAMPLE_MODE: "seek"
      PROGRESS_WRITE_INTERVAL_S: "3"
    volumes:
      - storage:/data
      - ./timestamp_correction/backend:/app
      - timestamp_model_cache:/root/.EasyOCR
      - ${YADISK_HOST_PATH:-/mnt/yandex-videos}:${YADISK_HOST_PATH:-/mnt/yandex-videos}:ro
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
      timestamp-correction-api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  storage:
  model_cache:
  timestamp_model_cache:
  # macromodel_pgdata:
  # macromodel_storage: